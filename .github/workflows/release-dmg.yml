# Back-compat: redirect name kept for old links.
# Prefer workflow "Release" (release.yml) which builds macOS + Windows.

name: Release DMG

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Use the Release workflow instead (macOS + Windows)."
        required: false
        default: "deprecated-use-Release"

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Point to unified Release workflow
        run: |
          echo "::notice::This workflow is deprecated. Use Actions → Release (release.yml) for macOS DMG + Windows installer."
          exit 1
